name: AuraNote
options:
  bundleIdPrefix: com.eastlakestudio
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

packages:
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit.git
    from: 0.9.0

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: "J4RT98GF7B"
    SWIFT_VERSION: "5.9"

targets:
  AuraNote:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - AuraNote
    dependencies:
      - package: WhisperKit
    settings:
      base:
        INFOPLIST_FILE: AuraNote/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.eastlakestudio.auranote
        PRODUCT_NAME: AuraNote
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: "YES"
        SWIFT_INCLUDE_PATHS: "$(SRCROOT)/Libraries/sherpa-onnx"
        LIBRARY_SEARCH_PATHS: "$(SRCROOT)/Libraries/sherpa-onnx/lib"
        OTHER_LDFLAGS: "$(inherited) -lsherpa-onnx-c-api"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
    preBuildScripts:
      - name: "Embed SherpaOnnx Libraries"
        script: |
          set -e
          FRAMEWORKS_DIR="${BUILT_PRODUCTS_DIR}/${FRAMEWORKS_FOLDER_PATH}"
          mkdir -p "$FRAMEWORKS_DIR"
          for dylib in libsherpa-onnx-c-api.dylib libsherpa-onnx-cxx-api.dylib libonnxruntime.1.27.0.dylib libonnxruntime.dylib; do
            cp -f "${SRCROOT}/Libraries/sherpa-onnx/lib/$dylib" "$FRAMEWORKS_DIR/"
          done
        basedOnDependencyAnalysis: false
      - name: "Copy SherpaOnnx Models"
        script: |
          set -e
          MODELS_DIR="${BUILT_PRODUCTS_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/sherpa-onnx-models"
          mkdir -p "$MODELS_DIR"
          cp -R "${SRCROOT}/Libraries/sherpa-onnx/models/"* "$MODELS_DIR/"
        basedOnDependencyAnalysis: false
    info:
      path: AuraNote/Info.plist
      properties:
        CFBundleName: AuraNote
        CFBundleDisplayName: 听纪
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSMicrophoneUsageDescription: "听纪需要访问麦克风以录制会议音频"
        NSSpeechRecognitionUsageDescription: "听纪需要语音识别权限以进行实时语音转写"
        LSApplicationCategoryType: "public.app-category.productivity"
    entitlements:
      path: AuraNote/AuraNote.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.device.audio-input: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.exception.mach-lookup.global-name:
          - com.apple.audioanalyticsd

  AuraNoteTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    sources:
      - AuraNoteTests
    dependencies:
      - target: AuraNote
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: com.eastlakestudio.auranote.tests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/AuraNote.app/Contents/MacOS/AuraNote
        BUNDLE_LOADER: $(TEST_HOST)
        SWIFT_INCLUDE_PATHS: "$(SRCROOT)/Libraries/sherpa-onnx"
        LIBRARY_SEARCH_PATHS: "$(SRCROOT)/Libraries/sherpa-onnx/lib"
        OTHER_LDFLAGS: "$(inherited) -lsherpa-onnx-c-api"

schemes:
  AuraNote:
    build:
      targets:
        AuraNote: [run, test, profile, analyze, archive]
        AuraNoteTests: [test]
    archive:
      config: Release
    test:
      targets:
        - AuraNoteTests
